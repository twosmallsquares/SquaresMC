<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SquaresMC Launcher</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #111111;
    color: #ffffff;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 25px;
    text-align: center;
}

h1 {
    font-size: 28px;
    margin-bottom: 8px;
    color: #b6ff00;
}

.subtitle {
    color: #999999;
    font-size: 14px;
    margin-bottom: 30px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

button,
a {
    width: 100%;
    padding: 15px;

    border-radius: 8px;

    font-size: 16px;
    font-weight: bold;

    text-decoration: none;

    cursor: pointer;

    transition: background 0.15s ease;
}

.launch {
    background: #b6ff00;
    color: #111111;
    border: 1px solid #b6ff00;
}

.launch:hover {
    background: #9ee600;
}

.discord {
    background: #222222;
    color: #b6ff00;
    border: 1px solid #b6ff00;
}

.discord:hover {
    background: #2d2d2d;
}

.footer {
    margin-top: 25px;
    color: #666666;
    font-size: 12px;
}

</style>
</head>

<body>

<div class="container">

    <h1>
        SquaresMC Launcher
    </h1>

    <div class="subtitle">
        Desktop Launcher
    </div>

    <div class="buttons">

        <button
            class="launch"
            onclick="launchTuffClient()"
        >
            Launch Tuff Client
        </button>

        <a
            class="discord"
            href="https://discord.com/invite/4tjW5Dz5Fv"
            target="_blank"
            rel="noopener noreferrer"
        >
            Discord
        </a>

    </div>

    <div class="footer">
        © 2026 SquaresMC
    </div>

</div>

<script>

function launchTuffClient() {

    localStorage.setItem("game", "true");

    window.location.href = "/WASM/index.html";

}

</script>

</body>
</html>
